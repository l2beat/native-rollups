[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# `via_ir = true` because some queue tests destructure long tuples on top of
# already-deep local-variable frames; the legacy pipeline hits stack-too-deep.
via_ir = true

# Deps are not vendored into the book repo. To run the tests:
#   cd contracts
#   forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@master
#   forge test
#
# `RLP.sol` currently lives only on OpenZeppelin master (not a tagged release),
# hence the @master pin.
