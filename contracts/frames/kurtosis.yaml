# A local network with the frames-devnet-0 settings: Gloas from genesis and
# the EIP-8141 execution fork at epoch 1. It runs the two frames-devnet-0
# clients whose pools take blob-carrying frame transactions, in the EIP-7594
# network form: Nethermind and Reth. Run with:
#   kurtosis run github.com/ethpandaops/ethereum-package --enclave frames --args-file frames/kurtosis.yaml
participants:
  - el_type: nethermind
    el_image: ethpandaops/nethermind:frames-devnet-0
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable
  - el_type: reth
    el_image: ethpandaops/reth:frames-devnet-0
    # Proofs at past blocks, for deposit claims, which prove the message
    # tree at the L1 block an L2 block anchors to, up to 256 blocks back.
    el_extra_params:
      - --rpc.eth-proof-window=256
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable

network_params:
  gloas_fork_epoch: 0
  heze_fork_epoch: 1
  frames_enabled: true
  gas_limit: 200000000
  genesis_gaslimit: 200000000
