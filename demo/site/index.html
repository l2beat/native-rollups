  <template id="about">
    <h1>What's real and what's mocked</h1>
    <p class="lead">Everything this demo cannot run yet is missing from L1, not from the rollup. Each mock stands in for
      one L1 feature and goes away when that feature ships.</p>
    <table class="mock-table">
      <thead><tr><th>Part</th><th>Status</th><th>What stands in</th><th>Goes away with</th></tr></thead>
      <tbody>
        <tr><td>L1 chain with frame transactions and blobs</td><td><span class="badge real">Real</span></td><td>A local copy of frames-devnet-0 with Nethermind and Reth</td><td></td></tr>
        <tr><td>L2 execution</td><td><span class="badge real">Real</span></td><td>execution-specs' Amsterdam rules with EIP-8141, as on the L1</td><td></td></tr>
        <tr><td>Stateless validation program</td><td><span class="badge real">Real</span></td><td>Run as ordinary code instead of inside a zkVM</td><td></td></tr>
        <tr><td>Block data in blobs</td><td><span class="badge real">Real</span></td><td>EIP-8142's encoding, on real L1 blobs</td><td></td></tr>
        <tr><td>Rollup contract, L2 messenger, message proofs</td><td><span class="badge real">Real</span></td><td></td><td></td></tr>
        <tr><td>This explorer's L2 data</td><td><span class="badge real">Real</span></td><td>Rebuilt from L1 alone by an independent follower, which re-executes every block</td><td></td></tr>
        <tr><td>Proof</td><td><span class="badge mock">Mock</span></td><td>A trusted key signs blocks that the real program accepted</td><td>A zkVM proof of the same program</td></tr>
        <tr><td>Proof check on L1 (EIP-8288)</td><td><span class="badge mock">Mock</span></td><td>A frame that calls a contract checking the signature</td><td>EIP-8288, which lets L1's own proof cover it</td></tr>
        <tr><td>Verification key registry (EIP-8357)</td><td><span class="badge mock">Mock</span></td><td>An admin registers a placeholder key hash instead of a fork, since the proofs are signatures</td><td>EIP-8357</td></tr>
        <tr><td>Blob check in the program (EIP-8142)</td><td><span class="badge mock">Mock</span></td><td>The node checks that the blobs encode the block</td><td>EIP-8142 in the L1 program</td></tr>
        <tr><td>Operator and users</td><td><span class="badge real">Real</span></td><td>One operator runs the L2 node as the rollup's sequencer, the only account the rollup contract takes blocks from, in the book's preconfirmations customization. Users sign their own transactions, deposit claims included, and send them to the node's RPC, which this demo keeps local</td><td></td></tr>
        <tr><td>Preconfirmations</td><td><span class="badge real">Real</span></td><td>The sequencer builds a block every 4 seconds, empty if no transaction waits, signs its hash at once, and posts it once a fixed wait, standing in for proving time, has passed. A bond in the rollup contract backs every signature: anyone who shows a broken one has it burned</td><td></td></tr>
        <tr><td>Claims for others</td><td><span class="badge real">Real</span></td><td>Messages carry a fee for whoever claims them. A relayer on L2 and a claimer on L1 claim those whose recipients cannot, as anyone could, and recipients claim their own for free</td><td></td></tr>
        <tr><td>Example apps</td><td><span class="badge real">Real</span></td><td>An ERC-20 bridge and a ping pong, each a contract on both chains that only accepts the calls its messenger delivers from the other. The story bridges a demo token, and spamoor plays ping pong</td><td></td></tr>
        <tr><td>Activity</td><td><span class="badge real">Real</span></td><td>Besides the story, spamoor sends ERC-20 transfers, Uniswap swaps, EIP-7702 delegations, EIP-8141 frame transactions, ETH in both directions and pings</td><td></td></tr>
      </tbody>
    </table>
    <p class="note">The prover key is the only trusted part. The follower checks it: it re-executes every block from L1
      data alone and compares the result with what the contract accepted.</p>
    <p class="note">The explorer reads everything from the chains, except what an explorer takes from elsewhere too: names
      such as Alice or Ping pong, the sources of the demo's contracts, and which chain an app's address arguments are on
      come from the demo's own records, as labels and verified contracts do.</p>

    <h2>What we learned building it</h2>
    <p class="section-lead">Problems and optimizations the demo surfaced, each now part of the design.</p>
    <div class="cards">
      <a class="card" href="http://127.0.0.1:3000/specification.html#data-layout"><h3>One block could halt the chain</h3>
        <p>Ethereum's rules accept a block at the maximum timestamp, after which no block can follow. The contract now keeps L2 time behind L1 time.</p></a>
      <a class="card" href="http://127.0.0.1:3000/gas_token_deposits.html#design"><h3>Nobody could pay for the first transaction</h3>
        <p>With no ETH on L2, no one could claim the first deposit. With frame transactions, a deposit pays for its own claim.</p></a>
      <a class="card" href="http://127.0.0.1:3000/specification.html#genesis"><h3>The L2 and its contract need each other</h3>
        <p>The L2's genesis names the L1 contract, which stores the genesis hash. The genesis is built for the address the contract will have.</p></a>
      <a class="card" href="http://127.0.0.1:3000/messaging.html#l2-to-l1-messaging"><h3>Half of each block's cost was new storage</h3>
        <p>Keeping every L2 state root created a slot per block. Keeping the last 8,191 halves the cost of each block.</p></a>
      <a class="card" href="http://127.0.0.1:3000/messaging.html#l1-to-l2-messaging"><h3>Deposits cost a slot and a 3 KB proof each</h3>
        <p>A Merkle tree of messages halves the L1 cost, and claims in the same block share one proof, leaving about 450 bytes each.</p></a>
      <a class="card" href="http://127.0.0.1:3000/specification.html#nativerollup-contract"><h3>Nodes could not find the data</h3>
        <p>Without events, a node would scan every L1 transaction to find messages and blocks. The contract now announces both.</p></a>
      <a class="card" href="http://127.0.0.1:3000/preconfirmations.html"><h3>Preconfirmations can be enforced on L1</h3>
        <p>The rollup contract gets every block's hash, so a broken preconfirmation is two different hashes, and L1 can slash it.</p></a>
      <a class="card" href="http://127.0.0.1:3000/specification.html#open-questions"><h3>Each block takes a whole blob</h3>
        <p>Block-in-Blobs gives every block its own blobs. Blocks of a few KB fill a small part of theirs, while rollups today share blobs across many blocks.</p></a>
      <a class="card" href="http://127.0.0.1:3000/specification.html#blob-encoding"><h3>The program does not handle blobs yet</h3>
        <p>Ethereum's validation program does not implement Block-in-Blobs yet. The design depends on it, and the demo checks the blobs in the node instead.</p></a>
    </div>
