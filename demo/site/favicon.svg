<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A block inside a block: an L2 that runs on L1's own rules. Edges sit
       on even coordinates, so the 16-pixel icon stays sharp. -->
  <rect width="32" height="32" rx="7" fill="#3b5bdb"/>
  <rect x="7" y="7" width="18" height="18" rx="3.5" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#fff"/>
</svg>
